    note: >-
      Verified the squashed tree is byte-identical to the reviewed tip 59b876b (both tree 604f510d).
      Three silent-loss defects were caught by review and would otherwise have shipped: a FIFO at
      the note path swallowing the entry and returning nil (found independently by the correctness
