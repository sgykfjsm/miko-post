batch_4_review_notes:
  reviewed_at: 2026-09-07
  verdict: passed-with-notes
  resolved_in_cycle_1: >-
    Five should-fix findings, all reproduced by execution before fixing and mutation-verified after:
    an empty-key group inlined past the reserved-key filter (COR-001/ADV-003); the filter enumerating
    slog's output key names while the renamer worked from its input names, so an attr keyed time or
    msg was renamed into ts/event (ADV-002); os.OpenFile blocking forever on a FIFO at the log path
    (ADV-001); Close not being idempotent while its test could not fail (COR-002); and the go/ast
    registration scan missing 5 of 6 declaration shapes (COR-003).
  decisions_taken:
    - id: "COR-012/CON-007"
      question: "logging.path=/dev/null warned on every run once a non-regular path was refused"
      decision: >-
        Narrowed the refusal to a directory, a FIFO and a socket; device nodes are allowed.
        LoggingSettings has no disable toggle, so /dev/null is how a user opts out, and a char
        device opens instantly and discards exactly as asked. Only a FIFO can block.
      recorded_in: "internal/logging/logger.go usableAsLog"
    - id: ADV-D-002
      question: "should the emission path recover() so a panicking Options.Writer cannot take down a post"
      decision: >-
        Yes. PostLogger.log recovers and latches the panic through safeWriter, so it surfaces as
        FR-076's one warning instead of unwinding into the sink's goroutine. Not deferred to
        T068-T070: this batch's own objective is "never panicking, never blocking a post", and
        Options.Writer is where rotation's rename/stat/reopen logic will live.
      recorded_in: "internal/logging/logger.go PostLogger.log"
      superseded_in_part: >-
        By DEC-F1 (batch 10a), and only the last clause. Rotation's rename/stat/reopen logic does
        not live behind Options.Writer: it is internal/logging/rotate.go, reached from logging.Open,
        and Options.Writer is now documented as the way to opt out of rotation. The decision itself
        is unaffected, because the reason to recover was never the rotating writer - it is that any
        writer a caller supplies can panic.
    - id: ADV-D-001
      question: "where the bot-token scrub lives"
      decision: >-
        A chokepoint in internal/logging. Options.Redact takes config.Secret values and the
        handler's ReplaceAttr removes them from every string, error and Stringer at every depth,
        flattening an error to its message because slog hands an unrecognised value to json.Marshal
        which prints *url.Error's URL verbatim. Unbypassable by a call site, and exact-substring
        replacement of a known credential rather than a pattern, so it cannot mangle legitimate
        text. Does not replace T084's end-to-end sentinel gate.
      recorded_in: "internal/logging/logger.go Options.Redact, scrub, redactAll"
      obligation: "T040/T063 must construct the logger with Options.Redact carrying the resolved bot token"
  followups_filed:
    filed_at: 2026-09-07
    issues:
      - {number: 107, subject: "logging.Open does not apply ResolvePath, so a default install silently writes no diagnostics", sources: [CON-004], severity: latent-defect}
    comments:
      - {issue: 69, subject: "T068 must repeat the non-regular-file guard and O_APPEND, which the Options.Writer seam bypasses; plus the bufio caveat for os.Exit durability", sources: [CON-006]}
      - {issue: 41, subject: "T040 must construct the logger with Options.Redact; the slog.Duration nanosecond trap; the seven reserved keys; the #98 Targeter path", sources: [ADV-004, ADV-D-001], also_relevant_to: 64}
      - {issue: 105, subject: "contracts/log-events.md and design.md §11.2 must admit the 'unknown' sentinel for source and message_id", sources: [CON-003, COR-007]}
    not_filed:
