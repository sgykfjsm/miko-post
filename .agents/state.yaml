            satisfied by the mechanism (make install stamps both fields, verified by T090), not by
            what end users reach. Keeping go install means accepting that the commit field is dead
            on that channel. The version field still identifies the release, and the tag maps it
            to exactly one commit, so a record stays attributable. This narrows design §14's
            "not an acceptable default" to "accepted for v0.1".
