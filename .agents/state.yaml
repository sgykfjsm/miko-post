  6c_blocker: >-
    T036 places build.go in internal/post, which cannot compile: the sink packages import
    internal/post to implement post.Sink, so internal/post constructing them is an import cycle.
    Reproduced independently during the 6a contract review. build.go has to live in cmd/mp or a
    small wiring package, which also preserves the property that internal/post imports no other
    internal package.

