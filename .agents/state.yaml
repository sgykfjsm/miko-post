    fix_dispositions: {COR-001: fixed, CON-001: fixed, CON-002: fixed}
    fix_validation: "make check passed; all three focused regression mutants rejected"
    fix_receipt: "/Users/shige/.agents/review-runs/sgykfjsm__miko-post/20260911T004422Z-c992f78b/fix-01/receipt.yaml"
    review_run_state: "/Users/shige/.agents/review-runs/sgykfjsm__miko-post/20260911T004422Z-c992f78b"
    prerequisites_met: true
    validation: "1420095: make check and uncached full race suite passed; post/app coverage100.0%, logging99.3%"
    mutants_run: 32
    mutants_survived_by_design: 2
    shape: >-
      post.Recording/post.Recorder declared in internal/post (DEC-D2), the mapping onto
      logging.Event in internal/app/recorder.go, wired at internal/cli/run.go through
      app.NewService(settings, app.NewRecording(logger)). post.New takes a third parameter and
      tolerates nil. sinkRecord arbitrates one start and one finish per sink under a mutex, with the
      recorder called while it is held so a losing goroutine cannot emit a finish before the
      winner's start.
    decisions_taken:
      - id: DEC-E1
        question: >-
          #98 box 1 needs path on obsidian_append_started, which precedes Send, while a
          non-reporting sink's start must not be held back waiting for a report that never comes.
          How does the orchestrator tell the two apart once Targeter's getter is gone?
        decision: >-
          post.Targeter is deleted and replaced by two things. post.ReportTarget(ctx, path) carries
          the value per call, and post.TargetReporting is a declaration interface with one empty
          method, ReportsTarget(), which the orchestrator type-asserts and never invokes. A
          declaring sink's start event is held until the report arrives; a non-declaring sink's is
          emitted before Send. A declaring sink that then reports nothing still gets its start,
          emitted by sinkRecord ahead of its finish.
        why: >-
          The value cannot come from a method, which is what #111 is: a Sink is built once and
          serves every post, so any getter reports the sink's most recent target. But the
          orchestrator still needs one bit of type information, because the ordering decision has
          to be made before Send is entered. A marker method is unusual in Go and is the honest
          shape here - what is being declared is a behaviour of Send, not a value.
        alternatives_rejected: >-
          Requiring every sink to call ReportTarget (even with "") removes the marker but edits the
          merged telegram sink to report nothing, and makes correctness rest on a convention rather
          than the type system. Emitting the start before Send for everyone and putting path only on
          the two later records leaves #98 box 1 open and needs a contract amendment.
        costs: >-
          A method whose body is empty and which nothing calls, which reads oddly until the doc
          comment is read. A sink that declares and then never reports gets its start late rather
          than never, which is the fallback rather than the design.
      - id: DEC-E2
        question: >-
          error_type is required on a failure and T056 owns the classification. Emit a two-value
          stand-in now, or omit the field until T056?
        decision: >-
          Emit it. post.ErrorType(SinkResult) returns "timeout" or "failed" from the same
          errors.Is(err, context.DeadlineExceeded) predicate reasonFor uses, and a test asserts the
          two partition failures identically so the log and the terminal cannot disagree about one
          failure. T056 widens the set.
        why: >-
          An absent field is a query that silently returns nothing, which is the harm events.go's
          own comment is written about. A widening vocabulary is ordinary versioning and the
          contract already calls the event set a minimum; a query written today for "timeout" keeps
          working. Deriving both from one predicate is what stops the interim value drifting from
          the display reason it has to agree with.
      - id: DEC-E3
        question: >-
          A panicking Sink.Name resolves to the "unknown" sentinel, and the event vocabulary is
          keyed by sink name - so #110's recovered value has no lifecycle record to ride on. Where
          does it go?
        decision: >-
          nameOf returns it as SinkAttempt.NameErr, wrapped in the same panicError a panicking Send
          produces, and the adapter reports it on the post's terminal record in the error field.
          The same route carries a sink name with no registered events. The terminal record's own
          name and level still track AllSucceeded, so the exit status and the log agree.
        why: >-
          The alternatives both cost more than the case is worth. Adding vocabulary
          (sink_unattributable, or three of them) bloats a contract whose value is a small stable
          set, for a bug case. Adding a field to SinkResult guesses at T073's shape, which #110
          itself warns against. The terminal record is the one record always written, so a
          diagnostic there is awkwardly placed and reaches the operator, which beats correct and
          absent.
        note: >-
          This is also what closes the silent-drop hole: without it, a post with a panicking Name
          produced no records for that sink and said nothing about it, which is the failure shape
          five previous batches were caught by.
    found_and_fixed_outside_the_batch:
      - id: LOG-LEVEL
        what: >-
          internal/logging emitted level as "INFO"/"ERROR" for every logger with Options.Redact
          populated - which app.OpenLogger always does, so every real run since 6c-1.
          replaceAttrRedacting ran scrub before renameBuiltin; slog.Level implements fmt.Stringer,
          so scrub's Stringer arm stringified the level and renameBuiltin's type assertion to
          slog.Level then failed, so the lowercasing never happened.
          contracts/log-events.md admits only "info" and "error", and
          internal/logging/logger_test.go's own lowercase test passed because it configures no
          credential - the one shape no front door produces.
        why_in_scope: >-
          T040's records cannot satisfy the contract's level field without it, and it is a
          three-line reordering. Found by this batch's first end-to-end read of real records.
        fix: >-
          renameBuiltin runs first, then scrub. Pinned by
          TestLevelStaysLowercaseWithACredentialConfigured, which arms Redact and asserts both the
          lowercase level and that the scrub still redacts - so the fix cannot be "the scrub no
          longer runs".
    inherited_obligations_discharged:
      - id: DEC-D2-mandatory
        how: >-
          TestTheAdapterProducesEveryOrchestratorReachableEvent compares app.ProducibleEvents()
          against logging.AllEvents() in both directions, with the three formatting-fallback names
          listed as deferred to T063 and their owner named. Killed by a mutant removing the telegram
          lifecycle from the adapter's table.
      - id: CON-007
        how: >-
          TestTheObsidianSinkIsBuiltFromItsOwnSettings now reads the vault instead of asking the
          sink where it went, with a pre-assertion that the vault is empty first so the check is
          proven capable of failing. Stronger than the Targeter version: a sink built from the zero
          ObsidianSettings resolves relative to the working directory, which is how a mutation run
          in this repo once left a stray note inside a source package.
      - id: adapter-fidelity
        how: >-
          Every adapter test drives a whole post through a real logging.Logger and reads the bytes
          back off disk, decoding one line at a time so FR-064's self-containment fails rather than
          being reassembled. duration_ms is asserted numerically against a sink held 120ms, which
          is the assertion that separates milliseconds from nanoseconds.
      - id: leak-fixture-must-be-proven-leaky
        how: >-
          TestTheBotTokenNeverReachesARecordThroughSinkResultErr t.Fatalf's unless the *url.Error
          fixture's own rendering contains the sentinel, before asserting the log does not. The
          typed-nil and panicking-render fixtures are proven dangerous the same way, by asserting
          the unguarded call panics.
    open_questions_answered:
      - "error_type: emitted now, two values, one predicate shared with reasonFor (DEC-E2)"
      - "message: not emitted at all; FR-068 recorded as knowingly unmet until T071, in tasks.md and in contracts/log-events.md"
