    coordinator_error_worth_recording: >-
      The PR body was opened with "Closes #30 (T029), #37 (T036), #38 ..." on one line, and GitHub
      registered only the first - the identical defect found as CON-001 in batch 6a, where four
      references registered as one, and which already had a memory written about it. Caught because
      closingIssuesReferences is checked after every PR open rather than trusted from the text.
      Without that check five issues would have stayed open after merge. The verification habit
      saved it; the memory did not.
    decisions:
      - id: DEC-D1
        decision: >-
          Sink construction, logger construction, the seconds-to-Duration conversion and the
          Recorder adapter all live in a new internal/app package - the composition root. T036's
          recorded path internal/post/build.go is abandoned. cmd/mp stays what plan.md says it is:
          parse argv via internal/cli, call app.*, dispatch, one os.Exit.
        why: >-
          internal/post/build.go cannot compile - the sinks import internal/post to implement
          post.Sink, so internal/post constructing them is a cycle. cmd/mp was the obvious
          alternative and is wrong for a specific reason: internal/gui cannot import package main,
          and #111's cheapest fix puts sink construction on the GUI's submit path rather than its
          constructor, so betting on "the GUI never builds a sink" bets against a fix this batch
          should make. internal/sink (the empty parent package) was the closest runner-up and was
          rejected because it can host T036 and nothing else, leaving wiring in two places. One
          composition root beats two.
        costs: >-
          plan.md's Source Code layout does not list internal/app - a planning amendment is owed.
          T036's and T039's recorded file paths become wrong and must be corrected in tasks.md and
          issue #37 in the same change. internal/app must import no front door or the cycle returns
          from the other side; worth an import-graph assertion in make check, since this repo already
          treats the compiler as the enforcement mechanism for principle II.
      - id: DEC-D2
        decision: >-
          internal/post keeps its invariant of importing no other internal package. T040 emits
          through a domain-shaped post.Recorder interface declared in internal/post; the mapping
          onto logging.Event lives in internal/app. New(sinks, timeout, rec) is nil-tolerant, so a
          nil Recording is a no-op and every batch-5 test stays valid unchanged.
        why: >-
          The invariant is load-bearing, and the evidence is not that three PR bodies call it a
          guarantee. service.go:79-82 cites it as the reason for a shipped design choice - Service
          takes a time.Duration rather than config.Settings precisely so the settings tree does not
          sit behind the posting core. And go list -deps shows internal/logging imports
          internal/config, so post -> logging reintroduces post -> config transitively: the exact
          dependency service.go refuses, arriving by the back door. plan.md's Structure Decision
          says package boundaries are how constitution principle II is enforced by the compiler
          rather than by review.
        counter_argument_considered: >-
          internal/post already imports log/slog, and a concrete *logging.PostLogger would give
          higher-fidelity tests - real JSON bytes - which matters given this project's defect
          history. Right about fidelity, wrong about where to buy it: the interface keeps the
          boundary and the fidelity is bought back by testing the ADAPTER against a real
          logging.Logger{Writer: buf}. Every trap on #41's acceptance list (duration_ms in
          nanoseconds, the seven reserved keys, Redact omitted) is a record-shape bug, not an
          orchestrator bug.
        costs: >-
          One indirection the logging package's source-scan test cannot see: it scans
          internal/logging's own source and cannot tell that the adapter never produces a given
          event name. 6c-2 MUST include an adapter test asserting the set of names the adapter can
          produce equals the orchestrator-reachable subset of logging.AllEvents(), so an unmapped
          name fails rather than silently never firing. Also a public interface in a package whose
          minimalism is a documented value, and two suites instead of one.
      - id: DEC-D3
        decision: >-
          The orchestrator installs a per-call target reporter on the context; the obsidian sink
          calls it the instant it resolves the note path, before any I/O, and the orchestrator emits
          obsidian_append_started with the real path at that call. post.Targeter is deprecated.
        why: >-
          Issue #98's acceptance box 1 requires path on all three obsidian_append_* events, and it
          is NOT achievable as specified: setTarget runs at sink.go:190, inside Send, while the
          orchestrator emits _started before Send is entered - so Target() holds the previous post's
          value or "". #98 was written before an implementer existed and did not notice. Of the
          three ways out, only this one closes #98 box 1 and #111 at the same time and by
          construction: the value never leaves the goroutine, so it is per-post rather than
          per-Sink. It also keeps post.Sink at two methods, which #98's own acceptance requires.
          #111's own text already points here.
        costs: >-
          It edits merged Batch 6a code and deprecates an interface shipped one batch ago. The
          alternatives were cheaper and both worse: emitting _started without path needs a contract
          amendment and leaves #111 open, and building sinks per post closes #111 but does not fix
          _started at all and costs the Telegram sink its keep-alive.
        decided_by: user
      - id: DEC-D4
        decision: >-
          post.Message.Validate rejects a message containing invalid UTF-8, with its own sentinel
          ErrInvalidUTF8 alongside ErrEmptyMessage. FR-010's correction prompt fires, no destination
          is contacted, and the exit status is a failure. Decided by the user on 2026-09-09, before
          6c-1 was implemented, so the guard lands with the front door rather than being retrofitted.
        why: >-
          Not because the spec requires it - the spec is silent and its two relevant clauses
          contradict. Because the alternative's central promise is false: no destination keeps the
          bytes. Telegram appears to refuse them outright (tdlib's clean_input_string starts with
          check_utf8 and returns 400 "Strings must be encoded in UTF-8", whose description does not
          match the rescue predicate, so the sink fails closed); slog's JSON handler substitutes
          U+FFFD silently, measured, which makes SC-008 and FR-068 unsatisfiable for exactly these
          messages; and Obsidian is UTF-8-only, so the note's copy becomes U+FFFD at the user's next
          save. The real status-quo behaviour is therefore obsidian succeeds, telegram fails, exit 1
          - a half-delivered post, which is the outcome the two-sink design exists to prevent. Under
          both options the user has to retry; this one tells them while their text is still in front
          of them.
        accepted_cost: >-
          A user whose terminal reliably produces non-UTF-8 bytes - a legacy Shift_JIS or EUC-JP
          locale is the realistic case - cannot use the CLI front door until they fix their locale.
          Not a regression in outcome, since today they get a half-delivered post every time with no
          recoverable record, but it is a real change for them. If such a user turns up, option C
          (accept, plus a base64 copy in the failure record) is the humane answer.
        decisive_unknown: >-
          Whether Telegram refuses or accepts-and-substitutes was NOT confirmed against the live API
          - no token here, and the constitution keeps live-service calls out of the test suite. The
          evidence is the Bot API documentation plus tdlib source. If it is ever checked and Telegram
          accepts %FF, the failure becomes cosmetic rather than partial and option C becomes better.
          One sendMessage with text=a%FFb against a throwaway bot settles it; the result belongs in
          issue #104.
        decided_by: user
        owed_beyond_code: >-
          spec.md and data-model.md must record the reading, and constitution principle VI needs a
          clarifying sentence with a PATCH bump and a Sync Impact Report entry, because FR-050 and
          principle VI carry the same ambiguous sentence. contracts/cli-interface.md and
          gui-interface.md gain the second rejection reason. contracts/telegram-sink.md's DEC-C1
          section must say deliberately whether form encoding is kept as defence in depth or removed
          as redundant - recommendation: keep it, because a Message can be constructed without
          passing a front door, so the sink should not assume validation ran.
