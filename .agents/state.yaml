    open_questions:
      - id: DEC-ADV-A
        status: open
        filed_as: 132
        filed_at: 2026-09-18
        url: https://github.com/sgykfjsm/miko-post/issues/132
        raised_in: "batch 10b adversarial review (ADV-003)"
        question: >-
          What bounds the captured message field? The body is unbounded user text, now written
          verbatim onto one record per failed destination, into a log the user's only size control
          is rotate_size_mib - and FR-074 forbids ever deleting a rotated file.
        demonstrated: >-
          One 15 MiB message with two failing sinks produced two archives of ~15 MiB each against a
          1 MiB configured threshold: 2x the message on disk, and a single record 15x the threshold.
          Rotation is evaluated BEFORE the write, so a threshold cannot bound a record - rotation
          degenerates into one giant file per giant record. post.Message.Validate imposes no length
          bound and the telegram sink applies no client-side cap, so a long paste is rejected by the
          API and then logged in full.
        tension: >-
          SC-008 wants a failed post re-sendable from the log alone, which argues for the whole body.
          FR-072 and FR-074 give the user a size control that one unbounded record defeats, and the
          body is the user's private text kept forever.
        options_and_costs:
          - "No bound (status quo). SC-008 is literal; the log can grow to any multiple of the user's threshold, and never shrinks."
          - "Truncate at a documented cap with an explicit message_truncated marker. Bounded, SC-008 satisfied for realistic posts, lossy for the pathological one."
          - "Keep the full body only on the terminal record and a capped excerpt on each sink failure. One copy instead of N, at the cost of DEC-G1's one-record-has-everything property."
        deliberately_not_answered_in: 10b
        note: >-
          Not a regression: before this batch no record carried the body at all, so the amplification
          arrives with T071. It is disclosed rather than carried silently, and it is a product
          decision about what the log promises - the same shape as DEC-ADV-006 in 10a.

    not_fixed_here: >-
      Three items. (1) internal/app's test file does not compile for a 32-bit target - app_test.go:265
      uses int(config.MaxTimeoutSeconds), which overflows a 32-bit int. Pre-existing: app_test.go is
      byte-identical to 0e3df5e, and it was found only by running 10a's cross-vet gate over this
      batch's packages. 10a solved the same shape in internal/logging by scoping the 64-bit boundary
      to its own file. (2) The GUI cannot report a Close failure: logger.Close runs in Run's deferred
      call, after a.Run returns and the window is gone, so there is no surface left. Degraded()
      covers the open failure and every failed write, which are the two this front door can report.
      (3) The unbounded captured body, demonstrated by the adversarial stage as 2x amplification and
      a record 15x the configured rotation threshold - recorded as the open question DEC-ADV-A above
      and to be filed as an issue. All three disclosed in the PR body.
    decisions_note: >-
      Defined here as structured blocks, where DEC-A1 through DEC-F4 and DEC-ADV-006 live, and
      mirrored in prose in .agents/archive/batch-artifacts/batch-10b-pr-body.md. Contract finding CON-009: the first draft
      defined them ONLY in the PR body, and state.yaml recorded that 10a's PR description was
      replaced wholesale after review - so seven rationales were one rewrite away from being
      unreachable from state.yaml. The citations resolved; the durability did not.
    decisions_taken:
      - id: DEC-G1
        question: >-
          FR-068 says the body is recorded "if any destination failed". Which record carries it?
        decision: >-
          Every record that reports a SINK'S OWN OUTCOME as a failure - the *_failed events from
          SinkFinished - and the terminal record only when no failure record could carry it. The
          formatting-fallback records carry no body.
        why: >-
          SC-008 wants a failed post re-sendable "without consulting any other source", and the
          per-sink failure record already names the destination, the error type and the detail, so
          a reader who greps one line has everything. The terminal fallback covers the one shape
          that produces no per-sink record at all: a sink whose Name panics resolves to a sentinel
          the vocabulary does not cover, SinkStarted returns early, and the terminal record is the
          post's only record - without the fallback FR-068 is unmet for exactly that post. Applied
          unconditionally instead, a two-sink post that lost both would carry the user's private
          text three times. Hence claimBody, a claim rather than a read.
        repetition_bound: >-
          One record per destination that actually failed, plus the terminal record only when there
          were none that could carry it.
        recorded_in: "internal/app/recorder.go claimBody, terminalAttrs, failureAttrs"
      - id: DEC-G1a
        question: >-
          Should the formatting-fallback records (telegram_markdown_failed,
          telegram_plaintext_failed) carry the body, as the first implementation had them do?
        decision: "No."
        why: >-
          They are emitted from inside Send, before the post's outcome exists, and FR-039's rescue
          means a failed markdown attempt is routinely followed by a SUCCESSFUL plaintext one. So
          telegram_markdown_failed is a failure-shaped record inside a post that fully succeeded,
          and attaching the body there logged the user's private text on every rescued post -
          FR-068's privacy half breached on the most ordinary path there is, since the rescue
          exists because Telegram rejects ordinary punctuation. SC-008 loses nothing: a rescue that
          itself fails makes Send return a RescueError, and the sink's own telegram_send_failed
          record carries the body. These records are the stages; SinkFinished's is the outcome.
        found_by: "contract review finding CON-001, confirmed by a failing test before the fix"
        pinned_by: "TestARescuedPostIsASuccessAndRecordsNoBody and TestAFailedRescueRecordsTheBody"
        recorded_in: "internal/app/recorder.go FormattingFinished"
      - id: DEC-G2
        question: "Where does the body go when message_on_error_only is off?"
        decision: "On message_received, once per post, and on no other record."
        why: >-
          FR-068's two clauses are scoped differently and only the first is conditional: "WHEN
          error-only message capture is enabled, successful events MUST omit message content". The
          second - "if any destination failed, the original message body needed to reconstruct that
          post MUST be recorded" - binds in both modes. In the disabled mode the intake record
          satisfies it: every post emits one, and it shares the post's message_id (R-007), so a
          failed post's body is always recorded and always joinable to its failures. What FR-068
          leaves open is only the PLACEMENT, and putting the body on every record would repeat the
          user's text once per destination for no reconstruction benefit.
        correction: >-
          An earlier version of this decision said "FR-068 constrains only the enabled case", which
          is false - it stops the quotation before the second clause's unconditional MUST (contract
          finding CON-004). The behaviour was already compliant; the justification was not, and it
          had been asserted as fact in contracts/log-events.md, where a future change could have
          relied on it to stop recording the body in that mode altogether.
        recorded_in: "internal/app/recorder.go MessageReceived, claimBody"
      - id: DEC-G3
        question: >-
          FR-071 wants a trace for a panic. recover() returns the value only - where does the stack
          come from?
        decision: >-
          debug.Stack() inside the deferred recover in internal/post, carried on panicError and
          read back through a new exported post.Traced interface.
        why: >-
          The frames are already unwound when the deferred function runs its body and entirely gone
          by the time a SinkResult reaches internal/app, so there is no later point at which a
          trace can be obtained: FR-071's "traces for panics" is unimplementable without a change at
          the recovery point. This is outside T073's stated file (internal/logging/logger.go) and
          the precedent is explicit - SinkAttempt.NameErr's comment records that the panic VALUE
          used to be discarded where it was recovered and that keeping it "needed a change at the
          point of recovery rather than a later task". An interface rather than an exported error
          type, because the recovered value beside the trace can hold a credential, which is why
          describePanic exists. Capture is unconditional: internal/post reads no settings and one
          debug.Stack() on a panic costs nothing; whether the trace is RECORDED is stack_trace's
          business, decided in internal/app.
        recorded_in: "internal/post/service.go panicError and Traced; internal/app/recorder.go traceFor"
      - id: DEC-G4
        question: "How is FR-071's ban on manufactured traces enforced?"
        decision: "By construction: only an error implementing post.Traced can produce a stack field."
        why: >-
          An expected operational error does not implement Traced, so no code path can produce a
          plausible-looking stack for one - the absence of a trace in the record is the absence of a
          trace in the error. The alternative, a list of error types that do and do not deserve a
          trace, would have to be kept in step with internal/post's classifier forever. Two mutants
          attack this directly and both are killed: a traceFor falling back to
          "goroutine 1 [running]:\n" + err.Error(), and a panicError.stack pinned to a plausible
          constant. The trace assertion names a frame from the panicking sink rather than checking
          the field is non-empty, which is what makes both detectable.
        recorded_in: "internal/app/recorder.go traceFor"
      - id: DEC-G5
        question: "How often may the GUI show FR-076's degradation warning?"
        decision: "Once per session, on the first post that observes a degradation."
        why: >-
          logging.Logger latches its degradation, so Degraded() keeps answering for the rest of the
          session, and the window outlives every post in it. Rendering that answer on each post
          would put the warning on the second post's result and the third's - one failure reported
          many times, which is not what FR-076's "exactly one warning" or SC-013's "told exactly
          once" mean. The CLI does not face this: it closes and renders once per process.
        accepted_consequence: >-
          A degradation that BEGINS mid-session is still reported, on the first post that could have
          been affected by it - pinned by TestADegradationThatBeginsMidSessionIsStillReported.
        recorded_in: "internal/gui/result.go degradationWarning"
      - id: DEC-G6
        question: >-
          A failed post normally renders "Details: <log path>". What happens when the log is what
          failed?
        decision: "The warning replaces that line rather than joining it."
        why: >-
          Pointing a user at a log for details when the log is the thing that failed is an
          instruction to read a file that does not have them. internal/cli/render.go already applies
          this reasoning to its own pairing; this makes the two front doors agree, and keeps the
          user to one sentence about the log rather than two.
        recorded_in: "internal/gui/result.go resultText"
      - id: DEC-G7
        question: "How do the two diagnostic settings reach the recorder?"
        decision: "NewRecording takes config.LoggingSettings."
        why: >-
          Its zero value means both settings off, and for MessageOnErrorOnly that is the LESS
          private direction - body recorded always. That is safe only because config.Defaults sets
          it true and both front doors build from loaded settings, which always pass through
          Defaults, and that assumption is asserted rather than assumed by
          TestTheShippedDefaultsRestrictCaptureAndCollectTraces. The field mirrors the contract key's
          name and direction rather than being inverted for a safer zero value: a field that
          disagrees with the key it implements is worse for a reader than a documented zero value.
        recorded_in: "internal/app/recorder.go Recording, NewRecording"
      - id: DEC-G8
        question: >-
          T073's text says "panics AND unexpected errors". Only panics produce a stack. Is the
          middle clause deferred?
        decision: >-
          No - it is satisfied. In this build stack is emitted for panics and for nothing else, and
          that is FR-071 met rather than FR-071 partially delivered.
        why: >-
          FR-071 qualifies all three of its categories with "where a trace is AVAILABLE and useful",
          and a plain Go error carries no frames. A panic is the only failure this program can
          obtain real frames for, because debug.Stack() runs inside the deferred recover while they
          still exist. For an unexpected non-panic error there is nothing to record and the same
          requirement forbids inventing something, so "no stack field" is the requirement honoured
          from both sides. A future sink error type that captures its own stack needs only to
          implement post.Traced; traceFor already asks every error in the chain.
        found_by: >-
          contract review finding CON-005 - the box had been ticked with the clause neither
          delivered nor discussed, and contracts/log-events.md asserted a coverage it then narrowed.
        recorded_in: >-
          specs/001-dual-sink-quick-post/contracts/log-events.md Traces section;
          specs/001-dual-sink-quick-post/tasks.md T073
