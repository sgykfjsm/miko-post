      coverage read 100% through all three cycles and flagged none of them.
    decision:
      id: DEC-A1
      decision: >-
        The orchestrator enforces the per-sink timeout rather than trusting each sink to honour its
        context. Delivery runs on a buffered channel and run stops waiting at timeout + a 250ms
        grace, abandoning the goroutine. Accepted costs: an abandoned goroutine (~4.9 KiB, uncapped,
        reclaimed on unblock, spinning rather than parked when a sink's error has a cyclic Unwrap)
        and a possible phantom write.
      why: >-
        T031's obsidian sink cannot honour a context - os.OpenFile and os.File.Write take none - so
        a vault on a synced or network mount would otherwise hold a post open indefinitely with its
        sibling's finished result unreachable.

