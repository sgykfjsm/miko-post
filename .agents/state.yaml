    decision_numbering: >-
      The A series is batch 5's, B is 6a's, C is 6b's. Numbering per batch because 6a's decisions
      were drafted reusing DEC-A1, which was already batch 5's orchestrator-timeout decision, and
      cited a second A-series id that was never recorded at all.
    decisions:
      - id: DEC-C1
        decision: >-
          The sendMessage body is application/x-www-form-urlencoded, not JSON. url.Values.Encode
          percent-encodes byte by byte, so the bytes the user typed are the bytes that go on the
          wire.
        why: >-
          json.Marshal(map[string]string{"text": "a\xffb"}) returns {"text":"a\ufffdb"} with
          err == nil - a silent U+FFFD substitution. With a JSON body Telegram would hold U+FFFD
          where the obsidian note holds the raw 0xFF, which is issue #113's option 3 - the two
          sinks storing different text for one post - and that option was rejected in advance.
          Reaching a rejected outcome by accident is worse than choosing it. What Telegram's
          server then does with a non-UTF-8 sequence is outside our control; the claim is only
          that we do not rewrite the user's bytes. #113 (and #104, its probable duplicate) remain
          open - this records a decision, it does not answer them.
      - id: DEC-C2
        decision: >-
          No error leaving Send carries the bot token. Every *url.Error layer is stripped BEFORE
          fmt.Errorf wraps, with a textual net behind it for shapes nobody enumerated.
        why: >-
          The token is a path segment of every Bot API URL, so net/http renders it verbatim in
          both Error() and %#v, and that error becomes post.SinkResult.Err, which
          internal/post/result.go deliberately leaves unredacted. Options.Redact (#41) cannot help
          - nothing on this path constructs a logger. Order matters: wrapping first bakes the URL
          into the message string where stripping can no longer reach it. This is the only layer
          that exists today; #103 and #115 cover the general case, and #115 is explicitly about
          the fact that this invariant is now load-bearing and unenforced.
      - id: DEC-C3
        decision: >-
          http_timeout_seconds is clamped where it becomes a time.Duration, inside this package,
          and a non-positive value floors to FR-040's 30s.
        why: >-
          T035 is the first code in the repo to convert a settings seconds int to a Duration, and
          18446744074 passes validation while wrapping to a positive ~290ms deadline. Clamping
          here keeps internal/config byte-unchanged, which is what lets this batch claim its
          boundary. The floor exists because http.Client reads Timeout: 0 as unbounded, so a
          zero would remove the bound rather than default it. Issue #114 owns the validation-layer
          fix; this clamp does not close it, and #114's acceptance requires that the clamp later
          be either kept as documented defence in depth or removed as redundant - deliberately,
          not by omission.
      - id: DEC-C4
        decision: >-
          Redirects are not followed. The http.Client sets CheckRedirect to return
          http.ErrUseLastResponse, so a 3xx becomes an ordinary response that the decode path fails
          closed on. Which arm it lands on depends on whether the 3xx body parses: an unparseable
          body reaches the decode arm, and a parseable one claiming ok reaches the contradiction
          arm and therefore carries errContradictoryStatus - which T061's rescue predicate has to
          know, because it is specified to exclude that sentinel.
        why: >-
          Go's default policy follows up to ten redirects, and measured against this sink that was
          three separate defects at once. A single 302 converted POST to GET, dropped the message
          body entirely, and reported the final host's {"ok":true} as success - delivered-but-absent,
          the worst outcome class this component has. The same hop handed the bot token to that
          host in the Referer header, because Go's refererForURL strips userinfo but keeps the path
          and the token is a path segment. And a 307 chain produced four wire requests each carrying
          the full user message, breaking FR-041's one-attempt guarantee. Telegram does not redirect
          sendMessage; anything that does is an intermediary this sink should refuse rather than
          obey. FR-041, FR-043.
    spec_amendments_owed:
      - requirement: FR-043
        artifact: "internal/config/secret.go (the Reveal doc comment)"
        owed_at: "whenever internal/config is next edited; not now, because 6b's boundary claim rests on that package being byte-unchanged"
        amendment: >-
          Reveal now has two call sites, not one: building the Telegram request URL, and the
          sink's credential net, which needs the string it is scrubbing for. The count is a review
          obligation, not a type invariant. data-model.md has been corrected in this batch;
          secret.go's comment still says "exactly one place".

