    decisions:
      - id: DEC-J1
        issue: 136
        decided_at: 2026-09-29
        by: maintainer
        decision: >-
          When os.UserHomeDir() fails, neither window opens: mp prints the reason to stderr and exits
          1 before the Fyne app is constructed. This covers the posting window and the startup-error
          window alike, and extends DEC-H2 from "no settings path" to "no home directory".
        why: >-
          Fyne derives its storage from the home directory alone, so without one it writes Library/
          and fyne/ relative to the working directory. Not writing outside the application's own
          locations comes first, and a window whose storage would land in a random directory gains
          nothing from opening. Option 2, a storage-less Fyne app, was not researched; the
          maintainer chose option 1.
        relax_by: "find a supported way to construct the Fyne app without persistent storage and open the window in that mode"
      - id: DEC-J2
        issue: 96
        decided_at: 2026-09-29
        by: maintainer
        decision: >-
          git_commit is the 12-character lowercase hex prefix of the commit on every build path that
          identifies one: make build and make install, a local go build from vcs.revision, and an
          untagged go install from the pseudo-version. A tagged go install stays "unknown" (DEC-I1).
        why: >-
          The issue's first suggestion, the full 40-character SHA, is unreachable on the go install
          path: a pseudo-version carries only 12 characters of the commit, and nothing else is
          recorded there. 12 is therefore the longest shape every path can produce, and it is
          collision-resistant enough for this repository.
      - id: DEC-J3
        issue: 101
        decided_at: 2026-09-29
        by: maintainer
        decision: "Deferred beyond v0.1: no change to elide's coverage or truncation in this feature."
        why: "Needs pathological inputs (values of hundreds of thousands of characters); the maintainer judged it not worth v0.1 effort."
      - id: DEC-J4
        issue: 115
        decided_at: 2026-09-29
        by: maintainer
        decision: >-
          Option 1: the post.Sink contract states that an error returned from Send must not carry a
          credential. No SanitizeError helper and no shared assertion helper in v0.1.
        why: >-
          v0.1 has one credential-bearing sink, which sanitizes at its own boundary, and Batch 12's
          TestSecretLeakGate now checks the wired stack end to end. Options 2 and 3 are worth
          building when a second credential-bearing sink appears.
      - id: DEC-J5
        issue: 118
        decided_at: 2026-09-29
        by: maintainer
        decision: >-
          The Error() half of (*telegram.Sink).safe stays unpinned by design, and its comment says
          why: it is a fast path that the %#v scan subsumes for every error shape known today.
        why: "It is a performance choice, not a safety property; the house style since Batch 10b is to write down what a surviving mutant means."
      - id: DEC-J6
        issue: 137
        finding: Batch 13 review ADV-001 / COR-001 (decision item ADV-D1)
        decided_at: 2026-09-29
        by: maintainer
        decision: >-
          Option (b). In addition to DEC-I2's trim and whitespace refusal, a bot_token (from the file
          or MIKO_POST_TELEGRAM_BOT_TOKEN) containing an invisible character anywhere is refused at
          load: any rune in Unicode category Cf (format characters such as U+200B zero-width space
          and U+FEFF byte-order mark) or any rune that is not graphic (controls). The message quotes
          nothing.
        why: >-
          Zero-width characters and a BOM are not unicode.IsSpace, so DEC-I2 neither trimmed nor
          refused them, and a token carrying one made the redaction pattern differ from the bare
          token. The review reproduced the ADV-007 leak through it. Option (a), restricting the token
          to Telegram's alphabet, was rejected because contracts/config-schema.md deliberately does
          not encode a third party's credential format as a validation rule; (b) closes the leak
          without doing so.
        superseded_note: >-
          Superseded by DEC-J9 (2026-09-29): the claim above that (b) closes the leak did not hold,
          since graphic invisible and non-ASCII corruptions still loaded; DEC-J6's rejection of a
          Telegram-alphabet rule stands.
      - id: DEC-J7
        issue: 136
        finding: Batch 13 review ADV-002
        decided_at: 2026-09-29
        by: maintainer
        decision: "DEC-J1's refusal also applies when the home directory resolves to a path that is not absolute (for example HOME=tmp)."
        why: >-
          os.UserHomeDir returns $HOME without checking it, and Fyne joins its storage onto it, so a
          relative HOME makes Fyne write Library/ relative to the working directory: the #136 failure
          through another door.
      - id: DEC-J8
        issue: 115
        finding: Batch 13 review CON-002
        decided_at: 2026-09-29
        by: maintainer
        decision: >-
          Close #115 after merge with a comment saying acceptance item 1 was delivered (the post.Sink
          contract) and items 2 and 3 were declined by DEC-J4, to be revisited when a second
          credential-bearing sink appears.
        why: "Leaving it open keeps an obligation that may never become real; the revisit condition is recorded in DEC-J4 and in the closing comment."
        note: "Batch 13 cycle-1 CON-005: #115's acceptance item 4 (re-evaluating #103's XML path) is delivered in this batch through #103, and the closing comment says so."
      - id: DEC-J9
        issue: 137
        finding: Batch 13 cycle-1 review COR-005 / ADV-004 (decision item ADV-D2)
        decided_at: 2026-09-29
        by: maintainer
        supersedes: "DEC-J6's rule (DEC-J6's rejection of a Telegram-alphabet rule still stands)"
        decision: >-
          Option (b). After DEC-I2's trim, a bot_token (from the file or MIKO_POST_TELEGRAM_BOT_TOKEN)
          is refused at load unless every byte is printable ASCII other than space (0x21-0x7E). That
          one rule covers whitespace, format and control characters, graphic invisible runes (U+FE0F,
          U+3164, U+2800), visible non-ASCII corruptions (smart quotes, a fullwidth colon from an IME)
          and invalid UTF-8 bytes. The message quotes nothing.
        why: >-
          DEC-J6's category rule let graphic invisible and non-ASCII corruptions load, and the cycle-1
          review reproduced the ADV-007 leak through them end to end. Every genuine Bot API token is
          printable ASCII, so nothing legitimate is refused, and "printable ASCII" is a generic
          credential constraint rather than a third party's token format.
        residual: >-
          Mistakes inside printable ASCII (the token pasted with its quotes, a "bot" prefix, a TOKEN=
          prefix) still load. Such a token fails at Telegram, and while it is configured a bare token
          in a failed post's captured body is not redacted. The records say so instead of claiming the
          leak is closed unconditionally.
