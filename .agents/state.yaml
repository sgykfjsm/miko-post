  reason: >-
    Fourteen tasks across four packages and two unrelated external surfaces is not one review lens,
    and the diff would have been several times batch 5's - which needed three review cycles at a
    quarter of the size. state.yaml's own assumptions note says the recorded decomposition is
    orientation and not binding, and tasks.md's parallel-opportunities section already treats the
    two sinks as separable.
